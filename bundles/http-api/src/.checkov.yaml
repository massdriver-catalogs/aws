skip-check:
  # The alarm modules come from the Terraform registry, which pins by version.
  # Commit hashes only exist for git sources.
  - CKV_TF_1

  # The access log holds one line per request. It is encrypted with a key AWS
  # owns; a customer managed key adds one to rotate, pay for and keep
  # available, or API Gateway stops writing logs.
  - CKV_AWS_158

  # The alarm topic only carries alarm state changes to Massdriver. CloudWatch
  # can't publish to a topic encrypted with the AWS-managed SNS key, so
  # encrypting it means a customer managed key just for alarms.
  - CKV_AWS_26
