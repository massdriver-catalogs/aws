name: http-api
description: >-
  An API Gateway HTTP API with one auto-deployed stage. Functions attach their own routes to it, so
  one API can front many functions. Give it a subdomain to serve it from the environment's DNS zone.
source_url: https://github.com/massdriver-catalogs/aws/tree/main/bundles/http-api
version: 0.0.0

params:
  examples:
    - __name: Development
      region: us-east-1
      subdomain: api
      cors_allowed_origins: []
      throttle_rate: 50
      throttle_burst: 100
      access_log_retention_days: 1
    - __name: Production
      region: us-east-1
      subdomain: api
      cors_allowed_origins: []
      throttle_rate: 1000
      throttle_burst: 2000
      access_log_retention_days: 365
  required:
    - region
    - subdomain
    - cors_allowed_origins
    - throttle_rate
    - throttle_burst
    - access_log_retention_days
  properties:
    region:
      title: Region
      description: >-
        Functions attached to this API must be in the same region. With a DNS zone connected, this
        must be the zone's region.
      type: string
      default: us-east-1
      $md.immutable: true
      oneOf:
        - const: us-east-1
          title: us-east-1 (N. Virginia)
        - const: us-east-2
          title: us-east-2 (Ohio)
        - const: us-west-2
          title: us-west-2 (Oregon)
        - const: eu-west-1
          title: eu-west-1 (Ireland)
        - const: eu-central-1
          title: eu-central-1 (Frankfurt)
        - const: ap-northeast-1
          title: ap-northeast-1 (Tokyo)
    subdomain:
      title: Subdomain
      description: >-
        The API answers on this name under the connected DNS zone, e.g. `api` gives
        `api.dev.example.com`. Leave empty to use only the AWS address.
      type: string
      default: ""
      pattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)?$
      message:
        pattern: "One DNS label: lowercase letters, digits and hyphens, like api. No dots."
    cors_allowed_origins:
      title: Browser origins allowed to call it (CORS)
      description: >-
        Needed only when a web page on another origin calls this API from the browser, e.g.
        `https://app.example.com`. Leave empty for server-to-server use. `*` allows any site.
      type: array
      default: []
      uniqueItems: true
      items:
        type: string
        pattern: ^(\*|https?://[^\s/]+)$
        message:
          pattern: "An origin like https://app.example.com (no path), or *."
    throttle_rate:
      title: Steady requests per second
      description: >-
        Requests beyond this are rejected with 429. ***~$1 per million requests***, so this also
        caps what a runaway client can spend.
      type: integer
      default: 50
      minimum: 1
      maximum: 10000
    throttle_burst:
      title: Burst requests
      description: Short spikes allowed above the steady rate.
      type: integer
      default: 100
      minimum: 1
      maximum: 5000
    access_log_retention_days:
      title: Access log retention (days)
      description: One line per request in CloudWatch Logs. ***~$0.50 per GB ingested.***
      type: integer
      default: 1
      enum:
        - 1
        - 7
        - 30
        - 90
        - 365

dependencies:
  aws_authentication:
    resource_type: aws-iam-role@0.0.0
    required: true
  dns:
    resource_type: aws-dns-zone@0.0.0
    required: false

resources:
  api:
    resource_type: aws-http-api@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10
    config:
      checkov:
        # The environment is the second part of the instance slug, <project>-<environment>-<component>.
        halt_on_failure: '.params.md_metadata.default_tags["md-instance"] | split("-")[1] | . == "prod" or . == "production"'
        # With md-environment in the organization's default tags:
        # halt_on_failure: '.params.md_metadata.default_tags["md-environment"] | . == "prod" or . == "production"'

ui:
  ui:order:
    - region
    - subdomain
    - cors_allowed_origins
    - throttle_rate
    - throttle_burst
    - access_log_retention_days
    - "*"
  throttle_rate:
    ui:widget: updown
  throttle_burst:
    ui:widget: updown
