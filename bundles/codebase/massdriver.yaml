name: codebase
description: >-
  An application's codebase: the ECR repository its images go to and, when it has one, its Git
  repository. Runtimes connect to it to pull images. It can be shared with the application's
  Massdriver project to set as an environment default there.
source_url: https://github.com/massdriver-catalogs/aws/tree/main/bundles/codebase
version: 0.0.0

params:
  examples:
    - __name: Development
      share_with_project: true
    - __name: Production
      share_with_project: true
    - __name: Shared with the project
      share_with_project: true
    - __name: Not shared
      share_with_project: false
  required:
    - share_with_project
  properties:
    share_with_project:
      title: Share with the project
      description: >-
        Lets every environment of the application's project use the codebase, so it can be set as
        their default. Needs the project and the Massdriver service account connected. Off, it's
        used in its own project, linked like any other resource.
      type: boolean
      default: true

dependencies:
  massdriver:
    resource_type: massdriver-service-account@~0.1
    required: false
  repository:
    resource_type: source-repository@0.0.0
    required: false
  registry:
    resource_type: aws-ecr-repository@0.0.0
    required: true
  project:
    resource_type: app-project@0.0.0
    required: false

resources:
  codebase:
    resource_type: aws-codebase@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10
    config:
      checkov:
        # The environment is the second part of the instance slug, <project>-<environment>-<component>.
        halt_on_failure: '.params.md_metadata.default_tags["md-instance"] | split("-")[1] | . == "prod" or . == "production"'
        # With md-environment in the organization's default tags:
        # halt_on_failure: '.params.md_metadata.default_tags["md-environment"] | . == "prod" or . == "production"'

ui:
  ui:order:
    - share_with_project
    - "*"
