<text class="name" x="113.5" y="221.0" text-anchor="middle">A proxy in the VPC</text>
<text class="muted" x="113.5" y="239.0" text-anchor="middle">such as the Gamelab server</text>
<rect class="surface" x="266" y="48" width="182" height="72" rx="6"/>
<text class="name" x="280.0" y="70.0">lab.sh, as root</text>
<text class="muted" x="280.0" y="88.0">writes the prompt and</text>
<text class="muted" x="280.0" y="103.0">settings to /etc/gamelab</text>
<rect class="surface" x="266" y="150" width="187" height="72" rx="6"/>
<text class="name" x="280.0" y="172.0">opencode serve :4096</text>
<text class="muted" x="280.0" y="190.0">as the player,</text>
<text class="muted" x="280.0" y="205.0">with LAB_PASSWORD</text>
<rect class="surface" x="266" y="250" width="195" height="87" rx="6"/>
