<text class="muted" x="280.0" y="290.0">as gameserver, uid 10002</text>
<text class="muted" x="280.0" y="305.0">/play/ read only</text>
<text class="muted" x="280.0" y="320.0">/play/api/ saves</text>
<path class="surface" d="M680 196 A88 6 0 0 1 856 196 V249 A88 6 0 0 1 680 249 Z"/>
