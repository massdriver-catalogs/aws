<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 371" width="872" height="371" role="img" aria-label="A proxy inside the VPC, such as the Gamelab server, reaches the lab box's Fargate task in private subnets. lab.sh runs as root, writes the prompt and settings to /etc/gamelab, then starts opencode serve on port 4096 as the player with LAB_PASSWORD, and game-server.mjs on port 8080 as gameserver (uid 10002), with /play/ read only and /play/api/ for saves. The proxy uses basic auth to the helper, and GET plus POST and PUT under /play/api/ to the game server. The helper edits ~/game and the game server reads it, on the EFS home /home/player (uid 10001). The helper calls the Anthropic API. The game server reads and writes the optional gamedata DynamoDB table with the task role, on that table only.">
<title>A proxy inside the VPC, such as the Gamelab server, reaches the lab box's Fargate task in private subnets. lab.sh runs as root, writes the prompt and settings to /etc/gamelab, then starts opencode serve on port 4096 as the player with LAB_PASSWORD, and game-server.mjs on port 8080 as gameserver (uid 10002), with /play/ read only and /play/api/ for saves. The proxy uses basic auth to the helper, and GET plus POST and PUT under /play/api/ to the game server. The helper edits ~/game and the game server reads it, on the EFS home /home/player (uid 10001). The helper calls the Anthropic API. The game server reads and writes the optional gamedata DynamoDB table with the task role, on that table only.</title>
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .bg { fill: #0d1117; }
  .surface { fill: #111113; stroke: #3f3f46; stroke-width: 1.25; }
  .accent { fill: #0f2422; stroke: #2dd4bf; stroke-width: 1.5; }
  .ghost { fill: #111113; stroke: #3f3f46; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .well { fill: #0a0a0b; stroke: #27272a; stroke-width: 1.25; }
  .heading { fill: #8b8b94; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
  .name { fill: #fafafa; font-size: 13px; font-weight: 600; }
  .body { fill: #a1a1aa; font-size: 11.5px; }
  .muted { fill: #8b8b94; font-size: 10.5px; }
  .label { fill: #a1a1aa; font-size: 10.5px; }
  .labelAccent { fill: #2dd4bf; font-size: 10.5px; font-weight: 600; }
  .chip { fill: #0a0a0b; stroke: #27272a; stroke-width: 1; }
  .halo { paint-order: stroke; stroke: #0d1117; stroke-width: 4px; stroke-linejoin: round; }
  .edge { fill: none; stroke: #71717a; stroke-width: 1.4; }
  .edgeAccent { fill: none; stroke: #2dd4bf; stroke-width: 1.6; }
  .edgeThick { fill: none; stroke: #2dd4bf; stroke-width: 2.6; }
  .dashed { stroke-dasharray: 5 4; }
  .head { fill: #71717a; }
  .headAccent { fill: #2dd4bf; }
  .lifeline { stroke: #3f3f46; stroke-width: 1.25; stroke-dasharray: 3 4; }
  .activation { fill: #0f2422; stroke: #2dd4bf; stroke-width: 1; }
  .frame { fill: none; stroke: #3f3f46; stroke-width: 1.25; }
  .frameTab { fill: #0a0a0b; stroke: #3f3f46; stroke-width: 1.25; }
  .divider { stroke: #3f3f46; stroke-width: 1.25; stroke-dasharray: 5 4; }
  .note { fill: #0f2422; stroke: #2dd4bf; stroke-width: 1; }
  .badge { fill: #2dd4bf; }
  .badgeText { fill: #0d1117; font-size: 9.5px; font-weight: 700; }
</style>
