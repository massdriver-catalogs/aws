<text class="label" x="196.0" y="287.0" text-anchor="middle">to /play/api/</text>
<rect class="chip" x="519.6" y="195.3" width="88.9" height="20" rx="4"/>
<text class="label" x="564.0" y="209.3" text-anchor="middle">edits ~/game</text>
<rect class="chip" x="542.5" y="250.1" width="88.9" height="20" rx="4"/>
<text class="label" x="586.9" y="264.1" text-anchor="middle">reads ~/game</text>
<rect class="chip" x="523.4" y="304.3" width="108.1" height="34" rx="4"/>
