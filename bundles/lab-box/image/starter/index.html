<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PLAYER_NAME}}'s game</title>
<style>
  html, body { margin: 0; height: 100%; background: #14123a; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  .hello { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; pointer-events: none; }
  h1 { font-size: clamp(28px, 6vw, 56px); margin: 0; }
  p { font-size: clamp(16px, 3vw, 24px); margin: 0; opacity: .85; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="hello">
  <h1>Hi, {{PLAYER_NAME}}!</h1>
  <p>Tell your helper what game to make.</p>
  <p>Click to make stars.</p>
</div>
<script>
  const canvas = document.getElementById("sky");
  const ctx = canvas.getContext("2d");
  const stars = [];
  function size() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener("resize", size);
  size();
  function burst(x, y) {
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4;
      stars.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 80, hue: Math.random() * 360 });
    }
  }
  addEventListener("pointerdown", (e) => burst(e.clientX, e.clientY));
  setInterval(() => burst(Math.random() * canvas.width, Math.random() * canvas.height * 0.6), 1400);
  (function frame() {
    ctx.fillStyle = "rgba(20, 18, 58, 0.25)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.life--;
      ctx.fillStyle = `hsl(${s.hue} 90% 65%)`;
      ctx.fillRect(s.x, s.y, 3, 3);
      if (s.life <= 0) stars.splice(i, 1);
    }
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
