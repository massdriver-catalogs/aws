skip-check:
  # The alarm modules come from the Terraform registry, which pins by version.
  # Commit hashes only exist for git sources.
  - CKV_TF_1

  # An app's secrets are set in Massdriver and copied here on deploy, so they
  # rotate there. An AWS-managed key means the execution role needs only
  # secretsmanager:GetSecretValue, with no key policy to grant.
  - CKV2_AWS_57
  - CKV_AWS_149

  # Apps and the placeholder write to temporary and cache directories. A
  # read-only root filesystem breaks most images unless they are built for it.
  - CKV_AWS_336

  # Tasks reach images, AWS APIs and the app's own dependencies through the
  # VPC's egress; those destinations aren't known to this bundle.
  - CKV_AWS_382

  # The log group holds the app's output. It is encrypted with a key AWS owns;
  # a customer managed key adds one to rotate, pay for and keep available, or
  # logs stop being written.
  - CKV_AWS_158

  # TLS ends at the load balancer. Inside the VPC it forwards plain HTTP to
  # the task, which is what app images serve; HTTPS here would need every app
  # to carry its own certificate.
  - CKV_AWS_378

  # The alarm topic only carries alarm state changes to Massdriver. CloudWatch
  # can't publish to a topic encrypted with the AWS-managed SNS key, so
  # encrypting it means a customer managed key just for alarms.
  - CKV_AWS_26

  # The record is an alias for the cluster's load balancer, which the cluster
  # bundle makes. The check only counts targets made alongside the record.
  - CKV2_AWS_23
