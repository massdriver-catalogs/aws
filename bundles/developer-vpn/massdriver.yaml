name: developer-vpn
description: >-
  A small WireGuard server in the environment's VPC and one client configuration, so a developer
  can reach private databases, caches and services from their laptop.
source_url: https://github.com/massdriver-catalogs/aws/tree/main/bundles/developer-vpn
version: 0.0.0

params:
  examples:
    - __name: Sandbox
      instance_type: t4g.nano
      tunnel_cidr: 10.255.255.0/30
      allowed_source_cidrs:
        - 0.0.0.0/0
  required:
    - instance_type
    - tunnel_cidr
    - allowed_source_cidrs
  properties:
    instance_type:
      title: Server size
      description: >-
        One developer's traffic fits on the smallest size.
        ***t4g.nano ~$3/month, plus ~$3.65/month for its public IP.***
      type: string
      default: t4g.nano
      oneOf:
        - const: t4g.nano
          title: t4g.nano (2 vCPU, 0.5 GB)
        - const: t4g.micro
          title: t4g.micro (2 vCPU, 1 GB)
    tunnel_cidr:
      title: Tunnel network
      description: >-
        Addresses inside the tunnel. The server takes the first one and the laptop the second. Pick a
        range that is not the VPC's and not one the laptop already uses, such as a home network.
      type: string
      default: 10.255.255.0/30
      pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(30|29|28)$
    allowed_source_cidrs:
      title: Allowed laptop networks
      description: >-
        Public networks that may reach the server. WireGuard ignores packets without a valid key, so
        leaving it open to the internet does not reveal the server. Narrow it to an office or
        company VPN range if you have one.
      type: array
      minItems: 1
      default:
        - 0.0.0.0/0
      items:
        type: string
        pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$

dependencies:
  aws_authentication:
    resource_type: aws-iam-role@0.0.0
    required: true
  network:
    resource_type: aws-vpc@0.0.0
    required: true

resources:
  tunnel:
    resource_type: massdriver-wireguard-tunnel@~0.1
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - instance_type
    - tunnel_cidr
    - allowed_source_cidrs
    - "*"
