<path class="edge" d="M789.0 149.5 C821.4 149.5, 821.6 161.0, 858.0 161.0" marker-end="url(#bundles-github-repo-pipeline-head)"/>
<rect class="surface" x="16" y="16" width="163" height="57" rx="18"/>
<text class="name" x="97.5" y="41.0" text-anchor="middle">push</text>
<text class="muted" x="97.5" y="59.0" text-anchor="middle">to the default branch</text>
