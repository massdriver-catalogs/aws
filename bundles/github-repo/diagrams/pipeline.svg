<text class="name" x="504.0" y="45.5">image scan</text>
<rect class="surface" x="630" y="16" width="116" height="57" rx="6"/>
<text class="name" x="644.0" y="38.0">push to ECR</text>
<text class="muted" x="644.0" y="56.0">:git-sha</text>
<path class="surface" d="M699.51 110 L789.02 149.5 L699.51 189 L610 149.5 Z"/>
<text class="name" x="699.5" y="146.0" text-anchor="middle">release target</text>
<text class="muted" x="699.5" y="164.0" text-anchor="middle">set?</text>
<rect class="accent" x="360" y="130" width="131" height="57" rx="6"/>
<text class="name" x="374.0" y="152.0">deploy</text>
<text class="muted" x="374.0" y="170.0">into the project</text>
<rect class="ghost" x="860" y="140" width="60" height="42" rx="6"/>
<text class="name" x="874.0" y="162.0">stop</text>
<rect class="chip" x="537.4" y="144.0" width="31.2" height="20" rx="4"/>
<text class="labelAccent" x="553.0" y="158.0" text-anchor="middle">yes</text>
<rect class="chip" x="809.6" y="145.3" width="24.8" height="20" rx="4"/>
<text class="label" x="822.0" y="159.3" text-anchor="middle">no</text>
</svg>
