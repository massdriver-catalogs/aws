name: sqs-queue
description: >-
  An SQS queue for background work, with a dead-letter queue for messages that keep failing and
  ready-made send and consume IAM policies that apps attach instead of writing their own.
source_url: https://github.com/massdriver-catalogs/aws/tree/main/bundles/sqs-queue
version: 0.0.0

params:
  examples:
    - __name: Development
      region: us-east-1
      fifo: false
      visibility_timeout_seconds: 60
      message_retention_seconds: 345600
      max_receive_count: 3
      max_message_age_minutes: 60
    - __name: Production
      region: us-east-1
      fifo: false
      visibility_timeout_seconds: 180
      message_retention_seconds: 1209600
      max_receive_count: 5
      max_message_age_minutes: 15
  required:
    - region
    - fifo
    - visibility_timeout_seconds
    - message_retention_seconds
    - max_receive_count
    - max_message_age_minutes
  properties:
    region:
      title: Region
      description: Apps sending and consuming should run in the same region.
      type: string
      default: us-east-1
      $md.immutable: true
      oneOf:
        - const: us-east-1
          title: us-east-1 (N. Virginia)
        - const: us-east-2
          title: us-east-2 (Ohio)
        - const: us-west-2
          title: us-west-2 (Oregon)
        - const: eu-west-1
          title: eu-west-1 (Ireland)
        - const: eu-central-1
          title: eu-central-1 (Frankfurt)
        - const: ap-northeast-1
          title: ap-northeast-1 (Tokyo)
    fifo:
      title: Strict order (FIFO)
      description: >-
        Messages with the same group ID are delivered once, in the order sent. Standard queues are
        faster and deliver at least once, in rough order. Changing it means a new queue.
        ***~$0.50 per million requests, vs ~$0.40 for standard.***
      type: boolean
      default: false
      $md.immutable: true
    visibility_timeout_seconds:
      title: Processing time limit (seconds)
      description: >-
        How long a consumer has to finish a message before it is handed to another. For a Lambda
        consumer, set it to at least six times the function's timeout.
      type: integer
      default: 60
      minimum: 0
      maximum: 43200
    message_retention_seconds:
      title: Keep unprocessed messages for
      type: integer
      default: 345600
      oneOf:
        - const: 86400
          title: 1 day
        - const: 345600
          title: 4 days
        - const: 604800
          title: 7 days
        - const: 1209600
          title: 14 days
    max_receive_count:
      title: Attempts before dead-letter
      description: A message that fails this many times moves to the dead-letter queue.
      type: integer
      default: 3
      minimum: 1
      maximum: 100
    max_message_age_minutes:
      title: Alarm when a message waits longer than (minutes)
      description: How far behind consumers can fall before someone should look.
      type: integer
      default: 15
      minimum: 1
      maximum: 1440

dependencies:
  aws_authentication:
    resource_type: aws-iam-role@0.0.0
    required: true

resources:
  queue:
    resource_type: aws-sqs-queue@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10
ui:
  ui:order:
    - region
    - fifo
    - visibility_timeout_seconds
    - message_retention_seconds
    - max_receive_count
    - max_message_age_minutes
    - "*"
  visibility_timeout_seconds:
    ui:widget: updown
  max_receive_count:
    ui:widget: updown
  max_message_age_minutes:
    ui:widget: updown
