<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 516" width="836" height="516" role="img" aria-label="The AWS credential, open to every environment, is the default of platform main, gamelab main and the labs template. platform main (Network, DNS Zone, ECS Cluster) provides network, zone and cluster defaults to gamelab main (Image Repository, Codebase, Lab Power, Gamelab Server), and network and cluster defaults to the labs template (Lab Image Repository, Lab Codebase), which also makes its lab codebase its own default. forkEnvironment copies the template's defaults into each lab, such as labs-maya (Lab Box, Saves &amp; Scores) and labs-sam (Lab Box).">
<title>The AWS credential, open to every environment, is the default of platform main, gamelab main and the labs template. platform main (Network, DNS Zone, ECS Cluster) provides network, zone and cluster defaults to gamelab main (Image Repository, Codebase, Lab Power, Gamelab Server), and network and cluster defaults to the labs template (Lab Image Repository, Lab Codebase), which also makes its lab codebase its own default. forkEnvironment copies the template's defaults into each lab, such as labs-maya (Lab Box, Saves &amp; Scores) and labs-sam (Lab Box).</title>
<style>
