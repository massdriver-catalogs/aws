<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1011 134" width="1011" height="134" role="img" aria-label="bootstrap.sh publish publishes the resource types, the bundles and the server's bundle. bootstrap.sh projects applies bootstrap.tf: projects, canvases, groups, policies, the service account and the AWS credential. bootstrap.sh provision deploys the platform, then the lab image, then the server. The server then forks labs on the template's versions.">
<title>bootstrap.sh publish publishes the resource types, the bundles and the server's bundle. bootstrap.sh projects applies bootstrap.tf: projects, canvases, groups, policies, the service account and the AWS credential. bootstrap.sh provision deploys the platform, then the lab image, then the server. The server then forks labs on the template's versions.</title>
