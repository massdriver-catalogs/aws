<text class="body halo" x="564.8" y="250.0" text-anchor="middle">with lab_plan and player_age</text>
<path class="edgeAccent" d="M400.45 262 H726.0799999999999" marker-end="url(#examples-gamelab-new-lab-headAccent)"/>
<circle class="badge" cx="414.45" cy="262" r="8"/><text class="badgeText" x="414.4" y="265.4" text-anchor="middle">3</text>
<text class="body halo" x="564.8" y="296.0" text-anchor="middle">The environment exists</text>
<path class="edge dashed" d="M729.0799999999999 308 H403.45" marker-end="url(#examples-gamelab-new-lab-head)"/>
<circle class="badge" cx="715.0799999999999" cy="308" r="8"/><text class="badgeText" x="715.1" y="311.4" text-anchor="middle">4</text>
<text class="body halo" x="229.1" y="342.0" text-anchor="middle">The lab page: Getting the lab ready</text>
<path class="edge dashed" d="M400.45 354 H60.79" marker-end="url(#examples-gamelab-new-lab-head)"/>
<circle class="badge" cx="386.45" cy="354" r="8"/><text class="badgeText" x="386.4" y="357.4" text-anchor="middle">5</text>
