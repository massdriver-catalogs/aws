<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1069 1026" width="1069" height="1026" role="img" aria-label="Making a lab: the parent submits the first name, age, lesson, plan, extras and Anthropic key. The server checks them, forks labs-template into labs-maya with lab_plan and player_age, and shows the lab page as getting ready. In the background, for up to 90 minutes, it sets the LAB_PASSWORD and ANTHROPIC_API_KEY secrets on labs-maya-box, deploys labs-maya-gamedata when saves and scores were picked and waits for it, then deploys labs-maya-box with the name, age, lesson, model and the plan's size, waits for it, and tells the parent the lab is ready to play.">
<title>Making a lab: the parent submits the first name, age, lesson, plan, extras and Anthropic key. The server checks them, forks labs-template into labs-maya with lab_plan and player_age, and shows the lab page as getting ready. In the background, for up to 90 minutes, it sets the LAB_PASSWORD and ANTHROPIC_API_KEY secrets on labs-maya-box, deploys labs-maya-gamedata when saves and scores were picked and waits for it, then deploys labs-maya-box with the name, age, lesson, model and the plan's size, waits for it, and tells the parent the lab is ready to play.</title>
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .bg { fill: #0d1117; }
  .surface { fill: #111113; stroke: #3f3f46; stroke-width: 1.25; }
  .accent { fill: #0f2422; stroke: #2dd4bf; stroke-width: 1.5; }
  .ghost { fill: #111113; stroke: #3f3f46; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .well { fill: #0a0a0b; stroke: #27272a; stroke-width: 1.25; }
  .heading { fill: #8b8b94; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
  .name { fill: #fafafa; font-size: 13px; font-weight: 600; }
  .body { fill: #a1a1aa; font-size: 11.5px; }
  .muted { fill: #8b8b94; font-size: 10.5px; }
  .label { fill: #a1a1aa; font-size: 10.5px; }
  .labelAccent { fill: #2dd4bf; font-size: 10.5px; font-weight: 600; }
  .chip { fill: #0a0a0b; stroke: #27272a; stroke-width: 1; }
  .halo { paint-order: stroke; stroke: #0d1117; stroke-width: 4px; stroke-linejoin: round; }
  .edge { fill: none; stroke: #71717a; stroke-width: 1.4; }
  .edgeAccent { fill: none; stroke: #2dd4bf; stroke-width: 1.6; }
  .edgeThick { fill: none; stroke: #2dd4bf; stroke-width: 2.6; }
  .dashed { stroke-dasharray: 5 4; }
  .head { fill: #71717a; }
  .headAccent { fill: #2dd4bf; }
  .lifeline { stroke: #3f3f46; stroke-width: 1.25; stroke-dasharray: 3 4; }
  .activation { fill: #0f2422; stroke: #2dd4bf; stroke-width: 1; }
  .frame { fill: none; stroke: #3f3f46; stroke-width: 1.25; }
  .frameTab { fill: #0a0a0b; stroke: #3f3f46; stroke-width: 1.25; }
  .divider { stroke: #3f3f46; stroke-width: 1.25; stroke-dasharray: 5 4; }
  .note { fill: #0f2422; stroke: #2dd4bf; stroke-width: 1; }
  .badge { fill: #2dd4bf; }
  .badgeText { fill: #0d1117; font-size: 9.5px; font-weight: 700; }
</style>
<defs><marker id="examples-gamelab-new-lab-head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 .6 7.6 4 0 7.4z"/></marker><marker id="examples-gamelab-new-lab-headAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headAccent" d="M0 .6 7.6 4 0 7.4z"/></marker></defs>
