<text class="body halo" x="564.8" y="512.0" text-anchor="middle">labs-maya-box</text>
<path class="edgeAccent" d="M400.45 524 H726.0799999999999" marker-end="url(#examples-gamelab-new-lab-headAccent)"/>
<circle class="badge" cx="414.45" cy="524" r="8"/><text class="badgeText" x="414.4" y="527.4" text-anchor="middle">7</text>
<text class="body halo" x="564.8" y="588.0" text-anchor="middle">createDeployment labs-maya-gamedata, with</text>
<text class="body halo" x="564.8" y="604.0" text-anchor="middle">the plan's table settings</text>
<path class="edgeAccent" d="M400.45 616 H726.0799999999999" marker-end="url(#examples-gamelab-new-lab-headAccent)"/>
<circle class="badge" cx="414.45" cy="616" r="8"/><text class="badgeText" x="414.4" y="619.4" text-anchor="middle">8</text>
<text class="body halo" x="875.9" y="650.0" text-anchor="middle">DynamoDB table, on demand</text>
<path class="edgeAccent" d="M729.0799999999999 662 H1019.635" marker-end="url(#examples-gamelab-new-lab-headAccent)"/>
<circle class="badge" cx="743.0799999999999" cy="662" r="8"/><text class="badgeText" x="743.1" y="665.4" text-anchor="middle">9</text>
<text class="body halo" x="564.8" y="696.0" text-anchor="middle">Check every 15 seconds until it completes</text>
