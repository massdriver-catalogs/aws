<text class="body halo" x="440.4" y="168.0">the lesson, the plan, and a</text>
<text class="body halo" x="440.4" y="184.0">key that starts with sk-ant-</text>
<path class="edgeAccent" d="M400.45 194 H430.45 V210 H404.45" marker-end="url(#examples-gamelab-new-lab-headAccent)"/>
