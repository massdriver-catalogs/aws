<text class="heading" x="16.0" y="562.0">OPT</text>
<text class="labelAccent" x="55.2" y="562.0">Saves &amp; scores picked</text>
<text class="body halo" x="229.1" y="90.0" text-anchor="middle">New lab: first name, age, lesson (optional),</text>
<text class="body halo" x="229.1" y="106.0" text-anchor="middle">plan, extras, Anthropic key</text>
