<text class="body" x="564.8" y="396.0" text-anchor="middle">The rest runs in the background, for up to 90 minutes</text>
<text class="body halo" x="564.8" y="434.0" text-anchor="middle">setInstanceSecret LAB_PASSWORD on</text>
<text class="body halo" x="564.8" y="450.0" text-anchor="middle">labs-maya-box</text>
<path class="edgeAccent" d="M400.45 462 H726.0799999999999" marker-end="url(#examples-gamelab-new-lab-headAccent)"/>
<circle class="badge" cx="414.45" cy="462" r="8"/><text class="badgeText" x="414.4" y="465.4" text-anchor="middle">6</text>
