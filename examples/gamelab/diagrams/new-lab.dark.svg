<line class="lifeline" x1="729.0799999999999" y1="54" x2="729.0799999999999" y2="968"/>
<line class="lifeline" x1="1022.635" y1="54" x2="1022.635" y2="968"/>
<rect class="frame" x="8" y="548" width="1052.53" height="180" rx="6"/>
