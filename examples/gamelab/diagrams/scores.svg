<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1059 628" width="1059" height="628" role="img" aria-label="Saving a score: the game, in a sandboxed frame, calls Gamelab.addScore(&quot;Maya&quot;, 1200) from lib/saves.js, which posts to the server's api/scores path for the lab. The server checks the signed token, a body of 64 KB at most and POST only under api/, and forwards it to the game server on the box. The game server accepts a first name of letters only and a whole-number score, at most 120 writes a minute, puts the item in the Saves &amp; Scores table and trims the board to the top ten, and returns rank 1, the best score and the top ten. The game shows New high score!">
<title>Saving a score: the game, in a sandboxed frame, calls Gamelab.addScore(&quot;Maya&quot;, 1200) from lib/saves.js, which posts to the server's api/scores path for the lab. The server checks the signed token, a body of 64 KB at most and POST only under api/, and forwards it to the game server on the box. The game server accepts a first name of letters only and a whole-number score, at most 120 writes a minute, puts the item in the Saves &amp; Scores table and trims the board to the top ten, and returns rank 1, the best score and the top ten. The game shows New high score!</title>
<style>
