<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1282 1088" width="1282" height="1088" role="img" aria-label="A chat turn: the player taps Talk or types, and the lab page posts the message. The server checks the player is signed in, on the same site, the lab is ready and the message is under 2,000 characters, sends it to OpenCode with the lab's password, and accepts it. In parallel, OpenCode sends the message with the age rules to Claude and edits files in ~/game, while the page polls the server every 1.5 seconds while busy and every 4 seconds when idle for the helper's words and steps. When busy turns to idle, the page reloads the game from the game server through the server, without cookies, and index.html is never cached.">
<title>A chat turn: the player taps Talk or types, and the lab page posts the message. The server checks the player is signed in, on the same site, the lab is ready and the message is under 2,000 characters, sends it to OpenCode with the lab's password, and accepts it. In parallel, OpenCode sends the message with the age rules to Claude and edits files in ~/game, while the page polls the server every 1.5 seconds while busy and every 4 seconds when idle for the helper's words and steps. When busy turns to idle, the page reloads the game from the game server through the server, without cookies, and index.html is never cached.</title>
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .bg { fill: #ffffff; }
  .surface { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.25; }
  .accent { fill: #e7f4f2; stroke: #0d9488; stroke-width: 1.5; }
  .ghost { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .well { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.25; }
  .heading { fill: #6b7280; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
  .name { fill: #111827; font-size: 13px; font-weight: 600; }
  .body { fill: #4b5563; font-size: 11.5px; }
  .muted { fill: #6b7280; font-size: 10.5px; }
  .label { fill: #4b5563; font-size: 10.5px; }
  .labelAccent { fill: #0d9488; font-size: 10.5px; font-weight: 600; }
  .chip { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .edge { fill: none; stroke: #9ca3af; stroke-width: 1.4; }
  .edgeAccent { fill: none; stroke: #0d9488; stroke-width: 1.6; }
  .edgeThick { fill: none; stroke: #0d9488; stroke-width: 2.6; }
  .dashed { stroke-dasharray: 5 4; }
  .head { fill: #9ca3af; }
  .headAccent { fill: #0d9488; }
  .lifeline { stroke: #d1d5db; stroke-width: 1.25; stroke-dasharray: 3 4; }
  .activation { fill: #e7f4f2; stroke: #0d9488; stroke-width: 1; }
  .frame { fill: none; stroke: #d1d5db; stroke-width: 1.25; }
  .frameTab { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.25; }
  .divider { stroke: #d1d5db; stroke-width: 1.25; stroke-dasharray: 5 4; }
  .note { fill: #e7f4f2; stroke: #0d9488; stroke-width: 1; }
  .badge { fill: #0d9488; }
  .badgeText { fill: #ffffff; font-size: 9.5px; font-weight: 700; }
</style>
