<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 552" width="1128" height="552" role="img" aria-label="A parent or player reaches the Gamelab server over HTTPS through the load balancer. The server, in the platform VPC's private subnets, chats with the helper (OpenCode, port 4096) on each player's lab box with the lab's password, serves the game server's files and saves and scores calls, sets each box's ECS task count to sleep and wake it, and calls the Massdriver API as the Gamelab Server service account. On the box, the helper and the game server share a home folder on EFS. The helper calls the Anthropic API through the VPC's NAT with the lab's own key. The game server writes to the lab's optional DynamoDB table with the box's task role. ECR holds the server image and the lab image.">
<title>A parent or player reaches the Gamelab server over HTTPS through the load balancer. The server, in the platform VPC's private subnets, chats with the helper (OpenCode, port 4096) on each player's lab box with the lab's password, serves the game server's files and saves and scores calls, sets each box's ECS task count to sleep and wake it, and calls the Massdriver API as the Gamelab Server service account. On the box, the helper and the game server share a home folder on EFS. The helper calls the Anthropic API through the VPC's NAT with the lab's own key. The game server writes to the lab's optional DynamoDB table with the box's task role. ECR holds the server image and the lab image.</title>
