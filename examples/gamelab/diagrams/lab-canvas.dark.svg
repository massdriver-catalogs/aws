<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 277" width="660" height="277" role="img" aria-label="On a lab's canvas, the Lab Image Repository (ecr-repository) connects to the Lab Codebase (codebase) through repository, and the codebase, the ECS Cluster (ecs-cluster) and Saves &amp; Scores (dynamodb-table) connect to the Lab Box (lab-box) through codebase, cluster and table.">
<title>On a lab's canvas, the Lab Image Repository (ecr-repository) connects to the Lab Codebase (codebase) through repository, and the codebase, the ECS Cluster (ecs-cluster) and Saves &amp; Scores (dynamodb-table) connect to the Lab Box (lab-box) through codebase, cluster and table.</title>
<style>
