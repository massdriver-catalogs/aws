<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 676 663" width="676" height="663" role="img" aria-label="Gamelab Admins can do everything in the platform, gamelab and labs projects. The Gamelab Server service account can make, set up, deploy and remove environments in labs, and only view resources in platform and gamelab. A lab box's AWS role can mount its own home folder, open an ECS Exec shell for admins, and read and write its own Saves &amp; Scores table. The server's AWS role can change only the task count of the labs ECS services. The helper on a box can edit only ~/game.">
<title>Gamelab Admins can do everything in the platform, gamelab and labs projects. The Gamelab Server service account can make, set up, deploy and remove environments in labs, and only view resources in platform and gamelab. A lab box's AWS role can mount its own home folder, open an ECS Exec shell for admins, and read and write its own Saves &amp; Scores table. The server's AWS role can change only the task count of the labs ECS services. The helper on a box can edit only ~/game.</title>
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .bg { fill: #0d1117; }
  .surface { fill: #111113; stroke: #3f3f46; stroke-width: 1.25; }
  .accent { fill: #0f2422; stroke: #2dd4bf; stroke-width: 1.5; }
  .ghost { fill: #111113; stroke: #3f3f46; stroke-width: 1.25; stroke-dasharray: 4 3; }
  .well { fill: #0a0a0b; stroke: #27272a; stroke-width: 1.25; }
  .heading { fill: #8b8b94; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
  .name { fill: #fafafa; font-size: 13px; font-weight: 600; }
  .body { fill: #a1a1aa; font-size: 11.5px; }
  .muted { fill: #8b8b94; font-size: 10.5px; }
  .label { fill: #a1a1aa; font-size: 10.5px; }
  .labelAccent { fill: #2dd4bf; font-size: 10.5px; font-weight: 600; }
  .chip { fill: #0a0a0b; stroke: #27272a; stroke-width: 1; }
  .halo { paint-order: stroke; stroke: #0d1117; stroke-width: 4px; stroke-linejoin: round; }
  .edge { fill: none; stroke: #71717a; stroke-width: 1.4; }
  .edgeAccent { fill: none; stroke: #2dd4bf; stroke-width: 1.6; }
  .edgeThick { fill: none; stroke: #2dd4bf; stroke-width: 2.6; }
  .dashed { stroke-dasharray: 5 4; }
  .head { fill: #71717a; }
  .headAccent { fill: #2dd4bf; }
  .lifeline { stroke: #3f3f46; stroke-width: 1.25; stroke-dasharray: 3 4; }
  .activation { fill: #0f2422; stroke: #2dd4bf; stroke-width: 1; }
  .frame { fill: none; stroke: #3f3f46; stroke-width: 1.25; }
  .frameTab { fill: #0a0a0b; stroke: #3f3f46; stroke-width: 1.25; }
  .divider { stroke: #3f3f46; stroke-width: 1.25; stroke-dasharray: 5 4; }
  .note { fill: #0f2422; stroke: #2dd4bf; stroke-width: 1; }
  .badge { fill: #2dd4bf; }
  .badgeText { fill: #0d1117; font-size: 9.5px; font-weight: 700; }
</style>
