name: fauxcel-app
description: >-
  A Fauxcel site's functions: the customer's build as one Lambda function answering every route on
  its endpoint, with KV and Blob storage when they're connected. Runs on the Lambda function runtime.
source_url: https://github.com/massdriver-catalogs/aws/tree/main/examples/rocketsled/applications/fauxcel-app
version: 0.0.0

dependencies:
  kv:
    resource_type: aws-dynamodb-table@0.0.0
    required: false
  blob:
    resource_type: aws-s3-bucket@0.0.0
    required: false

resources: {}

app:
  runtime: lambda-function
  envs:
    KV_TABLE: 'if .dependencies.kv then .dependencies.kv.name else "" end'
    BLOB_BUCKET: 'if .dependencies.blob then .dependencies.blob.name else "" end'
