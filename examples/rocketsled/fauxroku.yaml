# bin/rocketsled serve -config ../aws/examples/rocketsled/fauxroku.yaml -env-file ../aws/examples/rocketsled/.env

server:
  addr: ":8081"
  base_url: "${FAUXROKU_BASE_URL}"
  session_secret: "${FAUXROKU_SESSION_SECRET}"

database:
  path: data/fauxroku/rocketsled.db
data_dir: data/fauxroku

massdriver:
  url: https://api.massdriver.cloud
  account_mode: tenant
  organization_id: "${MASSDRIVER_ORGANIZATION_ID}"
  # The Fauxroku Server service account: it can fork, deploy and remove
  # environments in the node, ruby and python projects and nothing else.
  api_key: "${FAUXROKU_MASSDRIVER_API_KEY}"

skin: skins/fauxroku

paas:
  runtimes:
    - id: node
      name: Node.js
      project: node
      template: template
      app_component: web
      image_param: image_uri
      # A welcome page from the runtime's own registry, until the app's image is pushed.
      pinned:
        web: {image_uri: "${FAUXROKU_NODE_WELCOME}"}
        worker: {image_uri: "${FAUXROKU_NODE_WELCOME}"}
    - id: ruby
      name: Ruby
      project: ruby
      template: template
      app_component: web
      image_param: image_uri
      # A welcome page from the runtime's own registry, until the app's image is pushed.
      pinned:
        web: {image_uri: "${FAUXROKU_RUBY_WELCOME}"}
        worker: {image_uri: "${FAUXROKU_RUBY_WELCOME}"}
    - id: python
      name: Python
      project: python
      template: template
      app_component: web
      image_param: image_uri
      # A welcome page from the runtime's own registry, until the app's image is pushed.
      pinned:
        web: {image_uri: "${FAUXROKU_PYTHON_WELCOME}"}
        worker: {image_uri: "${FAUXROKU_PYTHON_WELCOME}"}

  pinned:
    web:
      subdomain: "{{environment_id}}"
      spot: true
    worker:
      subdomain: ""
      spot: true

  addons:
    worker:
      title: Worker dynos
      summary: Background jobs from the same image, with PROCESS_TYPE=worker.
    db:
      title: Postgres
      summary: A managed PostgreSQL database. Sets DATABASE_URL and PGPASSWORD on your dynos.
    cache:
      title: Key-Value Store
      summary: Redis-compatible, TLS only. Sets REDIS_URL on your dynos.

  pipeline:
    stages:
      - id: development
        name: Development
        presets: {web: Development}
      - id: staging
        name: Staging
        presets: {web: Development, db: Development}
      - id: production
        name: Production
        presets: {web: Production, worker: Production, db: Production, cache: Production}
    promote: [web, worker]

  previews:
    presets: {web: Development}
    ttl: 6h

  plans:
    web:
      Development: {price: "~$7/mo", summary: "1 dyno, 0.25 vCPU, 0.5 GB."}
      Production: {price: "~$58/mo", summary: "2 dynos, 1 vCPU, 2 GB, up to 6 when busy."}
    worker:
      Development: {price: "~$7/mo", summary: "1 worker, 0.25 vCPU, 0.5 GB."}
      Production: {price: "~$58/mo", summary: "2 workers, 1 vCPU, 2 GB, up to 6 when busy."}
    db:
      Development: {price: "~$15/mo", summary: "db.t4g.micro, 20 GB, 1 day of backups."}
      Production: {price: "~$285/mo", summary: "db.m7g.large with a standby, 100 GB, 14 days of backups."}
    cache:
      Development: {price: "~$6/mo", summary: "Up to 1 GB, 1,000 requests a second."}
      Production: {price: "~$65/mo", summary: "Up to 10 GB, 100,000 requests a second, snapshots."}

  # Each person gets a little, and nothing lasts.
  limits:
    apps_per_person: 2
    total_apps: 10
    presets: [Development]
    addons: [worker, cache]
    ttl: 24h

  highlights:
    website: [url]
    aws-postgres: [hostname, port, database, username]
    aws-valkey: [hostname, port]

auth:
  providers:
    # Anyone with the password signs in under the name they type, and sees only that name's apps.
    password:
      password: "${FAUXROKU_PASSWORD}"
