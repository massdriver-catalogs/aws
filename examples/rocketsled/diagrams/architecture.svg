<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 616" width="936" height="616" role="img" aria-label="A developer signs in to the Rocketsled servers, one for fauxroku.yaml and one for fauxcel.yaml, and makes environments; each server forks and deploys through the Massdriver API as its own service account. In the operator's AWS account, the developer reaches web dynos on Fargate Spot over HTTPS through the load balancer at *.apps.example.com, and functions or the static file server on Lambda through the HTTP API's execute-api URL. Web and worker dynos use Postgres and the Valkey key-value store in the platform VPC; functions use DynamoDB KV and S3 blob or files. One image repository per runtime holds the images for the dynos and functions.">
<title>A developer signs in to the Rocketsled servers, one for fauxroku.yaml and one for fauxcel.yaml, and makes environments; each server forks and deploys through the Massdriver API as its own service account. In the operator's AWS account, the developer reaches web dynos on Fargate Spot over HTTPS through the load balancer at *.apps.example.com, and functions or the static file server on Lambda through the HTTP API's execute-api URL. Web and worker dynos use Postgres and the Valkey key-value store in the platform VPC; functions use DynamoDB KV and S3 blob or files. One image repository per runtime holds the images for the dynos and functions.</title>
