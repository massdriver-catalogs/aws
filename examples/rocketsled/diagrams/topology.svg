<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 710" width="736" height="710" role="img" aria-label="The AWS credential, open to every environment, is the default of platform main and of the ruby and static templates. platform main (Network, DNS Zone, Router) shares the network and cluster with the ruby, node and python projects as defaults of their templates. The ruby template deploys its Image Repository and Codebase and links, without deploying, Web, Worker, Postgres and Key-Value Store; its codebase is its own default. Forks copy the defaults into ruby-dev (Web), ruby-staging (Web, Postgres), ruby-production (Web, Worker, Postgres, Key-Value Store) and ruby-pr42 (Web), and changes promote from dev to staging to production. The static template deploys an Image Repository and Codebase and links Endpoint, Site and Files; static-demo is forked from it.">
<title>The AWS credential, open to every environment, is the default of platform main and of the ruby and static templates. platform main (Network, DNS Zone, Router) shares the network and cluster with the ruby, node and python projects as defaults of their templates. The ruby template deploys its Image Repository and Codebase and links, without deploying, Web, Worker, Postgres and Key-Value Store; its codebase is its own default. Forks copy the defaults into ruby-dev (Web), ruby-staging (Web, Postgres), ruby-production (Web, Worker, Postgres, Key-Value Store) and ruby-pr42 (Web), and changes promote from dev to staging to production. The static template deploys an Image Repository and Codebase and links Endpoint, Site and Files; static-demo is forked from it.</title>
