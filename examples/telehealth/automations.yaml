# Only automations that need nothing deployed beside them. Groups go by name
# because their IDs change with every bootstrap.

autodeploy-downstream:
  attributes: {}
  config:
    # A component opts in with autodeploy=upstream-changes. The team list is
    # what each group is entitled to: a team outside it can set the value, and
    # nothing happens.
    rules:
      # Dev follows its dependencies right away.
      - name: dev-upstream-changes
        upstream:
          md-environment: dev
        downstream:
          autodeploy: upstream-changes
          md-environment: dev
          team: platform, patient-experience, clinical, revenue
        action: deploy

      # Prod gets a proposal instead, so a second person still approves every
      # change, the same as a deploy someone starts.
      - name: prod-upstream-changes
        upstream:
          md-environment: prod
        downstream:
          autodeploy: upstream-changes
          md-environment: prod
          team: platform, patient-experience, clinical, revenue
        action: propose

rollback-on-failure:
  attributes: {}
  config:
    # The apps opt in with autorollback=true on their components (bootstrap.tf).
    # A failed deploy of one goes back to its last good one, so a bad image doesn't
    # leave Booking, Charting or Claims down while someone looks into it.
    attribute:
      key: autorollback
      value: "true"

drift:
  attributes: {}
  config:
    # A component picks its schedule with driftwatch, and with autodeploy
    # hourly or daily to pick up new bundle releases. Each check's team list is
    # what that group is entitled to: the platform team gets everything, and
    # hourly runs cost plans, so other teams get them only where they matter.
    checks:
      - name: drift-hourly
        schedule: "0 * * * *"
        timezone: America/Los_Angeles
        match:
          driftwatch: drift-hourly
          team: platform, clinical
        mode: detect
        resolve_with: deployed
        max_concurrent: 3
        summary: true

      - name: drift-daily
        schedule: "0 6 * * *"
        timezone: America/Los_Angeles
        match:
          driftwatch: drift-daily
          team: platform, patient-experience, clinical, revenue
        mode: detect
        resolve_with: deployed
        max_concurrent: 3
        summary: true

      # Drift becomes a proposal that restores the last deployment, for a person to approve.
      - name: reconcile-proposal-hourly
        schedule: "0 * * * *"
        timezone: America/Los_Angeles
        match:
          driftwatch: reconcile-proposal-hourly
          team: platform
        mode: propose
        resolve_with: deployed
        max_concurrent: 3
        summary: true

      - name: reconcile-proposal-daily
        schedule: "0 6 * * *"
        timezone: America/Los_Angeles
        match:
          driftwatch: reconcile-proposal-daily
          team: platform, patient-experience, clinical
        mode: propose
        resolve_with: deployed
        max_concurrent: 3
        summary: true

      # Scheduled autodeploys redeploy the saved configuration, so a release on
      # the instance's channel goes out without anyone starting it. Prod proposes.
      - name: autodeploy-hourly-dev
        schedule: "0 * * * *"
        timezone: America/Los_Angeles
        match:
          autodeploy: hourly
          md-environment: dev
          team: platform
        mode: resolve
        resolve_with: saved
        max_concurrent: 3
        summary: true

      - name: autodeploy-hourly-prod
        schedule: "0 * * * *"
        timezone: America/Los_Angeles
        match:
          autodeploy: hourly
          md-environment: prod
          team: platform
        mode: propose
        resolve_with: saved
        max_concurrent: 3
        summary: true

      - name: autodeploy-daily-dev
        schedule: "0 6 * * *"
        timezone: America/Los_Angeles
        match:
          autodeploy: daily
          md-environment: dev
          team: platform, patient-experience, revenue
        mode: resolve
        resolve_with: saved
        max_concurrent: 3
        summary: true

      - name: autodeploy-daily-prod
        schedule: "0 6 * * *"
        timezone: America/Los_Angeles
        match:
          autodeploy: daily
          md-environment: prod
          team: platform, patient-experience, revenue
        mode: propose
        resolve_with: saved
        max_concurrent: 3
        summary: true

freeze-guard:
  config:
    # Prod changes wait for business hours on the West Coast, where Tendwell's
    # clinicians and on-call engineers are. Platform Engineering stays exempt so the
    # on-call engineer can still ship a fix overnight.
    timezone: America/Los_Angeles
    exempt_groups: [Platform Engineering]

    windows:
      - name: after-hours
        match:
          md-environment: prod
        weekly:
          - {from: Mon 17:00, to: Tue 08:00}
          - {from: Tue 17:00, to: Wed 08:00}
          - {from: Wed 17:00, to: Thu 08:00}
          - {from: Thu 17:00, to: Fri 08:00}
          - {from: Fri 17:00, to: Sat 08:00}
          - {from: Sat 17:00, to: Sun 08:00}
          - {from: Sun 17:00, to: Mon 08:00}

sandbox-on-join:
  config:
    # Each person who joins a Tendwell team gets an environment of their own in the
    # Developer Sandboxes project, forked from its template. Leaving the team
    # decommissions and deletes it.
    sandboxes:
      - group: Patient Experience
        project: sandboxes
        environment: template
        deleteAfterDecommission: true
        # The AWS credential, the dev cluster and VPC, the workspace image and the
        # provisioner, so the workspace and VPN deploy without connecting anything.
        copyEnvironmentDefaults: true
      - group: Clinical
        project: sandboxes
        environment: template
        deleteAfterDecommission: true
        copyEnvironmentDefaults: true
      - group: Revenue
        project: sandboxes
        environment: template
        deleteAfterDecommission: true
        copyEnvironmentDefaults: true
      - group: Platform Engineering
        project: sandboxes
        environment: template
        deleteAfterDecommission: true
        copyEnvironmentDefaults: true

statuspage:
  attributes: {}
  config:
    site:
      title: Tendwell Health Status
      timezone: America/Los_Angeles

    history_days: 30
    deploys_as_maintenance: true
    # Short enough that the reminders dead-letter alarm shows up while you watch.
    min_duration: 1m
    # A dot set to degraded or down on the canvas shows here too, and so does a
    # banner that warns. The info banners on dev are for engineers, not patients.
    stash:
      health: true
      banners: true
      min_level: warning

    pages:
      - title: Development
        slug: dev
        description: Tendwell's development environments.
        environments:
          - id: visits-dev
            title: Visits
            components: &visits
              - title: Booking
                description: Patients find an open slot and book a video visit.
                match: {md-component: app}
              - title: Booking API
                match: {md-component: api}
              - title: Open slots
                match: {md-component: slots}
              - title: Visit reminders
                description: Texts and emails before each visit.
                match: {md-component: notifier}
                impact: degraded
              - title: Reminders queue
                match: {md-component: reminders}
                impact: degraded
          - id: care-dev
            title: Care
            components: &care
              - title: Charting
                description: Clinicians chart and treat.
                match: {md-component: app}
              - title: Charts database
                match: {md-component: charts}
                impact: major_outage
              - title: Sessions
                match: {md-component: sessions}
              - title: Documents
                match: {md-component: documents}
                impact: partial_outage
          - id: billing-dev
            title: Billing
            components: &billing
              - title: Claims
                description: Billing files claims with payers.
                match: {md-component: app}
              - title: Claims ledger
                match: {md-component: ledger}
                impact: major_outage
              - title: Claim files
                match: {md-component: claims}

      - title: Tendwell Health
        slug: tendwell
        description: Booking, charting and billing for Tendwell Health.
        environments:
          - {id: visits-prod, title: Visits, components: *visits}
          - {id: care-prod, title: Care, components: *care}
          - {id: billing-prod, title: Billing, components: *billing}

router:
  config: |
      # Steps write to the container's own stdout, the router's process: the router
      # keeps a command's output for its debug logs, and these lines are for people
      # reading the Automations logs. No shell scripts: mass expands dollar signs in params.
      engine: jq
      routes:
        - name: deploy-failed
          events: [deployment.failed]
          do:
            - exec:
                - python3
                - -c
                - import sys; open('/proc/1/fd/1', 'w').write('\u2717 ' + sys.argv[1] + '\n')
                - '\(.data.attributes["md-instance"] // .data.entity.instance_id) \(.data.entity.action | ascii_downcase) failed\(if .data.entity.deployed_by_name then " (\(.data.entity.deployed_by_name))" else "" end)'

        - name: deploy-completed
          events: [deployment.completed]
          when: '.data.entity.action != "PLAN"'
          do:
            - exec:
                - python3
                - -c
                - import sys; open('/proc/1/fd/1', 'w').write('\u2713 ' + sys.argv[1] + '\n')
                - '\(.data.attributes["md-instance"] // .data.entity.instance_id) \(.data.entity.action | ascii_downcase)ed by \(.data.entity.deployed_by_name // "Massdriver")\(if .data.entity.message then ": \(.data.entity.message)" else "" end)'

        - name: proposal
          events: [deployment.proposed]
          do:
            - exec:
                - python3
                - -c
                - import sys; open('/proc/1/fd/1', 'w').write('? ' + sys.argv[1] + '\n')
                - '\(.data.entity.deployed_by_name) proposes to \(.data.entity.action | ascii_downcase) \(.data.attributes["md-instance"] // .data.entity.instance_id // "an instance"): \(.data.entity.message // "no message")'

        - name: alarm
          events: [alarm_state.created]
          do:
            - exec:
                - python3
                - -c
                - import sys; open('/proc/1/fd/1', 'w').write('! ' + sys.argv[1] + '\n')
                - '\(.data.entity.alarm_name) is \((.data.entity.notification.Message // "{}") | fromjson | .NewStateValue // "updated"): \(.data.entity.message // "")'

        - name: membership
          events: [group_membership.added, group_membership.removed]
          do:
            - exec:
                - python3
                - -c
                - import sys; open('/proc/1/fd/1', 'w').write('' + sys.argv[1] + '\n')
                - '\(if .type == "group_membership.added" then "+" else "-" end) \(.data.entity.account_name // .data.entity.account_email // .data.entity.service_account_name) \(if .type == "group_membership.added" then "joined" else "left" end) \(.data.entity.group_name)'

cost-explorer:
  config:
    title: Tendwell Health costs
    dimensions: [md-project, md-environment, md-component, team]

chaos-monkey:
  config:
    # Dry runs only: a PLAN shows what random params would do and changes
    # nothing. Every two hours on weekdays, one dev instance at a time, so the
    # plans are worth reading instead of noise.
    mode: plan
    schedule: "17 9-17/2 * * 1-5"
    timezone: America/Los_Angeles
    # Only the apps' projects: the platform is shared, and other examples can
    # live in the same organization.
    match:
      md-environment: dev
      md-project: visits, care, billing
    status: [PROVISIONED]
    instances: 1
    strategies:
      preset: 3
      merge: 2
      mutate: 2
      gibberish: 1


upgrade-train:
  config:
    # Every dev release of an app reaches dev on its own and goes to prod as a
    # proposal only after an hour in dev with no failed deploy and no alarm.
    trains:
      - name: tendwell-apps
        bundles: [tendwell-visits, tendwell-care, tendwell-billing, ecs-service, lambda-function]
        include_development: true
        stages:
          - name: dev
            match:
              md-environment: dev
            mode: deploy
            soak: 15m
          - name: prod
            match:
              md-environment: prod
            mode: propose
            soak: 1h

stale-proposals:
  config:
    # Prod deploys are proposals that wait for a second person, so each weekday
    # morning lists the ones still waiting. Nothing is rejected automatically:
    # a proposal can be a held-back prod change someone means to approve.
    schedule: "37 8 * * 1-5"
    timezone: America/Los_Angeles
    remind_after: 24h
    group_by: project

stash-sync:
  config: |
    # CloudWatch bills each metric it returns, so two minutes keeps the
    # canvas current for a few dollars a month instead of a few tens.
    interval: 120s
    cloudwatch:
      region: us-east-1

    # The apps share the cluster's load balancer, so each one's traffic is its
    # own target group.
    presets:
      - preset: aws-alb-traffic
        instance: platform-dev-cluster
        with:
          load_balancer: app/tf-lb-b837ae80b0387ed0e7d62af3ef/930deb08755e9878
      - preset: aws-alb-traffic
        instance: care-dev-app
        with:
          load_balancer: app/tf-lb-b837ae80b0387ed0e7d62af3ef/930deb08755e9878
          target_group: targetgroup/tf-c85567fd196b3fb8c8decb0569/ee360d73436638d1
      - preset: aws-alb-traffic
        instance: billing-dev-app
        with:
          load_balancer: app/tf-lb-b837ae80b0387ed0e7d62af3ef/930deb08755e9878
          target_group: targetgroup/tf-f33e96ef89d48f27c94d78b52c/c4a036230df4666c
      # db.t4g.micro allows about 80 connections on both engines.
      - preset: aws-rds-connections
        instance: care-dev-charts
        with: {db_instance: tendwell-health-care-dev-charts, max: "80"}
      - preset: aws-rds-connections
        instance: billing-dev-ledger
        with: {db_instance: tendwell-health-billing-dev-ledger, max: "80"}

    rules:
      # Health comes from each bundle's own alarms. An idle dev instance's
      # error alarms have no data, which is not a problem, so only ALARM
      # changes the dot.
      - target: {instance: care-dev-app, key: md/v1/health}
        cloudwatch: {alarm: tendwell-health-care-dev-app-unhealthy}
        text: [{below: 2, text: healthy}, {text: down}]
      - target: {instance: billing-dev-app, key: md/v1/health}
        cloudwatch: {alarm: tendwell-health-billing-dev-app-unhealthy}
        text: [{below: 2, text: healthy}, {text: down}]
      - target: {instance: care-dev-charts, key: md/v1/health}
        cloudwatch: {alarm: tendwell-health-care-dev-charts-cpu}
        text: [{below: 2, text: healthy}, {text: down}]
      - target: {instance: billing-dev-ledger, key: md/v1/health}
        cloudwatch: {alarm: tendwell-health-billing-dev-ledger-cpu}
        text: [{below: 2, text: healthy}, {text: down}]
      - target: {instance: care-dev-sessions, key: md/v1/health}
        cloudwatch: {alarm: tendwell-health-care-dev-sessions-storage}
        text: [{below: 2, text: healthy}, {text: down}]
      - target: {instance: visits-dev-app, key: md/v1/health}
        cloudwatch: {alarm: tendwell-health-visits-dev-app-errors}
        text: [{below: 2, text: healthy}, {text: down}]
      - target: {instance: visits-dev-notifier, key: md/v1/health}
        cloudwatch: {alarm: tendwell-health-visits-dev-notifier-errors}
        text: [{below: 2, text: healthy}, {text: down}]
      - target: {instance: visits-dev-api, key: md/v1/health}
        cloudwatch: {alarm: tendwell-health-visits-dev-api-5xx}
        text: [{below: 2, text: healthy}, {text: down}]
      - target: {instance: visits-dev-slots, key: md/v1/health}
        cloudwatch: {alarm: tendwell-health-visits-dev-slots-throttles}
        text: [{below: 2, text: healthy}, {text: down}]
      - target: {instance: platform-dev-network, key: md/v1/health}
        cloudwatch: {alarm: tendwell-health-platform-dev-network-nat-instance-status}
        text: [{below: 2, text: healthy}, {text: down}]
      - target: {instance: platform-dev-dns, key: md/v1/health}
        cloudwatch: {alarm: tendwell-health-platform-dev-dns-certificate-expiry}
        text: [{below: 2, text: healthy}, {text: down}]
      # Dead letters mean some reminders didn't go out; the queue still works.
      - target: {instance: visits-dev-reminders, key: md/v1/health}
        cloudwatch: {alarm: tendwell-health-visits-dev-reminders-dead-letters}
        text: [{below: 2, text: healthy}, {text: degraded}]

      - target: {instance: care-dev-app, key: md/v1/usage, field: value}
        cloudwatch: {namespace: AWS/ECS, metric: CPUUtilization, dimensions: {ClusterName: tendwell-health-platform-dev-cluster, ServiceName: tendwell-health-care-dev-app}}
      - {target: {instance: care-dev-app, key: md/v1/usage, field: max}, value: 100}
      - {target: {instance: care-dev-app, key: md/v1/usage, field: label}, value: CPU %}
      - target: {instance: billing-dev-app, key: md/v1/usage, field: value}
        cloudwatch: {namespace: AWS/ECS, metric: CPUUtilization, dimensions: {ClusterName: tendwell-health-platform-dev-cluster, ServiceName: tendwell-health-billing-dev-app}}
      - {target: {instance: billing-dev-app, key: md/v1/usage, field: max}, value: 100}
      - {target: {instance: billing-dev-app, key: md/v1/usage, field: label}, value: CPU %}
      - target: {instance: care-dev-sessions, key: md/v1/usage, field: value}
        cloudwatch: {namespace: AWS/ElastiCache, metric: BytesUsedForCache, dimensions: {clusterId: tendwell-health-care-dev-sessions}, stat: Maximum, period: 5m}
        scale: 0.00000095367431640625
      - {target: {instance: care-dev-sessions, key: md/v1/usage, field: max}, value: 1024}
      - {target: {instance: care-dev-sessions, key: md/v1/usage, field: label}, value: MB of 1 GB}
      - target: {instance: visits-dev-reminders, key: md/v1/usage, field: value}
        cloudwatch: {namespace: AWS/SQS, metric: ApproximateNumberOfMessagesVisible, dimensions: {QueueName: tendwell-health-visits-dev-reminders}, stat: Maximum}
        default: 0
      - {target: {instance: visits-dev-reminders, key: md/v1/usage, field: max}, value: 100}
      - {target: {instance: visits-dev-reminders, key: md/v1/usage, field: label}, value: reminders waiting}
      # The NAT instance has basic monitoring, one data point every five minutes.
      - target: {instance: platform-dev-network, key: md/v1/usage, field: value}
        cloudwatch: {namespace: AWS/EC2, metric: CPUUtilization, dimensions: {InstanceId: i-066c780cfb744f1ec}, period: 5m}
      - {target: {instance: platform-dev-network, key: md/v1/usage, field: max}, value: 100}
      - {target: {instance: platform-dev-network, key: md/v1/usage, field: label}, value: NAT CPU %}
      - target: {instance: visits-dev-app, key: md/v1/usage, field: value}
        cloudwatch: {namespace: AWS/Lambda, metric: Duration, dimensions: {FunctionName: tendwell-health-visits-dev-app}, stat: p95, period: 5m}
        default: 0
      - {target: {instance: visits-dev-app, key: md/v1/usage, field: max}, value: 10000}
      - {target: {instance: visits-dev-app, key: md/v1/usage, field: label}, value: p95 ms of the 10s timeout}
      - target: {instance: visits-dev-notifier, key: md/v1/usage, field: value}
        cloudwatch: {namespace: AWS/Lambda, metric: Duration, dimensions: {FunctionName: tendwell-health-visits-dev-notifier}, stat: p95, period: 5m}
        default: 0
      - {target: {instance: visits-dev-notifier, key: md/v1/usage, field: max}, value: 10000}
      - {target: {instance: visits-dev-notifier, key: md/v1/usage, field: label}, value: p95 ms of the 10s timeout}
      # S3 reports object counts once a day.
      - target: {instance: care-dev-documents, key: md/v1/usage, field: value}
        cloudwatch: {namespace: AWS/S3, metric: NumberOfObjects, dimensions: {BucketName: tendwell-health-care-dev-documents-083014189801, StorageType: AllStorageTypes}, period: 24h}
        default: 0
      - {target: {instance: care-dev-documents, key: md/v1/usage, field: max}, value: 1000}
      - {target: {instance: care-dev-documents, key: md/v1/usage, field: label}, value: visit notes}
      - target: {instance: billing-dev-claims, key: md/v1/usage, field: value}
        cloudwatch: {namespace: AWS/S3, metric: NumberOfObjects, dimensions: {BucketName: tendwell-health-billing-dev-claims-083014189801, StorageType: AllStorageTypes}, period: 24h}
        default: 0
      - {target: {instance: billing-dev-claims, key: md/v1/usage, field: max}, value: 1000}
      - {target: {instance: billing-dev-claims, key: md/v1/usage, field: label}, value: claim files}

      # Traffic on the lines out of the API, the functions and the table.
      - target: {instance: visits-dev-api, key: md/v1/traffic, field: rps}
        cloudwatch: {namespace: AWS/ApiGateway, metric: Count, dimensions: {ApiId: pdoodobthc}, stat: Sum}
        scale: 0.0166667
        default: 0
      - target: {instance: visits-dev-api, key: md/v1/traffic, field: errors_5m}
        cloudwatch: {namespace: AWS/ApiGateway, metric: 5xx, dimensions: {ApiId: pdoodobthc}, stat: Sum, period: 5m}
        default: 0
      - target: {instance: visits-dev-api, key: md/v1/traffic, field: p95_ms}
        cloudwatch: {namespace: AWS/ApiGateway, metric: Latency, dimensions: {ApiId: pdoodobthc}, stat: p95}
      - target: {instance: visits-dev-app, key: md/v1/traffic, field: rps}
        cloudwatch: {namespace: AWS/Lambda, metric: Invocations, dimensions: {FunctionName: tendwell-health-visits-dev-app}, stat: Sum}
        scale: 0.0166667
        default: 0
      - target: {instance: visits-dev-app, key: md/v1/traffic, field: errors_5m}
        cloudwatch: {namespace: AWS/Lambda, metric: Errors, dimensions: {FunctionName: tendwell-health-visits-dev-app}, stat: Sum, period: 5m}
        default: 0
      - target: {instance: visits-dev-notifier, key: md/v1/traffic, field: rps}
        cloudwatch: {namespace: AWS/Lambda, metric: Invocations, dimensions: {FunctionName: tendwell-health-visits-dev-notifier}, stat: Sum}
        scale: 0.0166667
        default: 0
      - target: {instance: visits-dev-notifier, key: md/v1/traffic, field: errors_5m}
        cloudwatch: {namespace: AWS/Lambda, metric: Errors, dimensions: {FunctionName: tendwell-health-visits-dev-notifier}, stat: Sum, period: 5m}
        default: 0
      # Read capacity units approximate reads per second for small items.
      - target: {instance: visits-dev-slots, key: md/v1/traffic, field: rps}
        cloudwatch: {namespace: AWS/DynamoDB, metric: ConsumedReadCapacityUnits, dimensions: {TableName: tendwell-health-visits-dev-slots}, stat: Sum}
        scale: 0.0166667
        default: 0
      - target: {instance: visits-dev-slots, key: md/v1/traffic, field: errors_5m}
        cloudwatch: {namespace: AWS/DynamoDB, metric: ReadThrottleEvents, dimensions: {TableName: tendwell-health-visits-dev-slots}, stat: Sum, period: 5m}
        default: 0

      # Banners are left to people and demo/sim.sh: a rule rewrites its entry every
      # few minutes, so a banner here would replace theirs.
      - target: {environment: visits-dev, key: md/v1/links}
        value:
          links:
            - {label: Booking, url: "https://visits.dev.tendwell.mdawssbx.com"}
            - {label: Status page, url: "https://statuspage.dev.tendwell.mdawssbx.com/dev/"}
      - target: {environment: care-dev, key: md/v1/links}
        value:
          links:
            - {label: Charting, url: "https://care.dev.tendwell.mdawssbx.com"}
            - {label: Status page, url: "https://statuspage.dev.tendwell.mdawssbx.com/dev/"}
      - target: {environment: billing-dev, key: md/v1/links}
        value:
          links:
            - {label: Claims, url: "https://billing.dev.tendwell.mdawssbx.com"}
            - {label: Status page, url: "https://statuspage.dev.tendwell.mdawssbx.com/dev/"}

log-results:
  attributes: {}
  config: |
    # Tendwell's bundles run OpenTofu with Checkov. Each PROVISION and PLAN
    # shows how its step ran, what it changes, and its Checkov findings as
    # widgets on the deployment. Every bundle has one step, src.
    actions: [PROVISION, PLAN]
    rules:
      - name: opentofu-step
        detect: (OpenTofu|Terraform) has been successfully initialized
        patterns:
          - (?P<tool>OpenTofu|Terraform) has been successfully initialized
          - (?:OpenTofu|Terraform) v(?:ersion:\s*)?(?P<tool_version>\d+\.\d+\.\d+)
          - (?P<message>(?:Apply|Destroy) complete! Resources:.*|Plan:.*|No changes\.)
          # OpenTofu boxes its errors. The provisioner's last line, Error: exit status 1, has no box.
          - '\x{2502} Error: (?P<error>.+)'
        key: step/src
        label: OpenTofu step
        value: >-
          {tool: (.tool | ascii_downcase), tool_version, action: $action, status: $status,
           message: ((.error // .message) | if . then tostring | .[:280] else . end)}
          | with_entries(select(.value != null))

      - name: opentofu-changes
        detect: (OpenTofu|Terraform) has been successfully initialized
        patterns:
          - (?P<tool>OpenTofu|Terraform) has been successfully initialized
          - 'Plan: (?:(?P<imports>\d+) to import, )?(?P<add>\d+) to add, (?P<change>\d+) to change, (?P<destroy>\d+) to destroy'
          - (?P<no_changes>No changes\.)
        mode: sum
        key: changes/src
        label: OpenTofu changes
        value: >-
          {tool: (.tool | ascii_downcase), add: (.add // 0), change: (.change // 0), destroy: (.destroy // 0)}

      - name: checkov
        detect: 'Passed checks: \d+'
        patterns:
          - 'By (?:Prisma Cloud|bridgecrew\.io) \| version: (?P<tool_version>\d+\.\d+\.\d+)'
          - 'Passed checks: (?P<passed>\d+), Failed checks: (?P<failed>\d+), Skipped checks: (?P<skipped>\d+)'
        mode: sum
        key: compliance/src
        label: Checkov
        value: >-
          {tool: "checkov", tool_version, passed, failed, skipped} | with_entries(select(.value != null))
