name: tendwell-visits-api
version: 0.0.0
label: Tendwell Visits API

ui:
  connectionOrientation: link

schema:
  title: Tendwell Visits API
  description: The booking API patients use to find and book video visits.
  type: object
  additionalProperties: false
  required:
    - url
    - region
  properties:
    url:
      title: URL
      description: Base URL of the API, e.g. https://visits.dev.tendwell.example.
      type: string
      pattern: ^https://
    region:
      title: Region
      type: string
