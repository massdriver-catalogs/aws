name: tendwell-billing
description: >-
  Tendwell's claims service, from the Clearpath acquisition. Pulls closed encounters from the Care
  API, keeps claims in MariaDB and writes claim files to S3. Runs on the ECS service runtime.
source_url: https://github.com/massdriver-catalogs/aws/tree/main/examples/telehealth/applications/billing
version: 0.0.0

dependencies:
  mariadb:
    resource_type: aws-mariadb@0.0.0
    required: true
  bucket:
    resource_type: aws-s3-bucket@0.0.0
    required: true
  care:
    resource_type: tendwell-care-api@0.0.0
    required: true

resources:
  billing:
    resource_type: tendwell-billing-api@0.0.0
    required: true

steps:
  - path: src
    resources:
      billing:
        template: |
          {
            url: .outputs.url,
            hostname: .outputs.hostname
          }

app:
  runtime: ecs-service
  envs:
    MD_ENVIRONMENT: '.params.md_metadata.default_tags["md-instance"] | split("-")[1]'
    MYSQL_HOST: .dependencies.mariadb.hostname
    MYSQL_PORT: .dependencies.mariadb.port
    MYSQL_DATABASE: .dependencies.mariadb.database
    MYSQL_USER: .dependencies.mariadb.username
    MYSQL_PASSWORD: '.dependencies.mariadb.secret_arn + ":password::"'
    BUCKET_NAME: .dependencies.bucket.name
    CARE_URL: .dependencies.care.url
  secrets:
    CLEARINGHOUSE_API_KEY:
      title: Clearinghouse API key
      description: Signs claim files so the clearinghouse accepts them. Claims are filed unsigned without it.
