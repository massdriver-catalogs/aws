name: tendwell-care
description: >-
  Tendwell's clinician portal. Shows the day's booked visits from the Visits API, keeps charts in
  PostgreSQL and visit notes in S3. Runs on the ECS service runtime.
source_url: https://github.com/massdriver-catalogs/aws/tree/main/examples/telehealth/applications/care
version: 0.0.0

dependencies:
  postgres:
    resource_type: aws-postgres@0.0.0
    required: true
  cache:
    resource_type: aws-valkey@0.0.0
    required: true
  bucket:
    resource_type: aws-s3-bucket@0.0.0
    required: true
  visits:
    resource_type: tendwell-visits-api@0.0.0
    required: true

resources:
  care:
    resource_type: tendwell-care-api@0.0.0
    required: true

steps:
  - path: src
    resources:
      care:
        template: |
          {
            url: .outputs.url,
            hostname: .outputs.hostname
          }

app:
  runtime: ecs-service
  envs:
    MD_ENVIRONMENT: '.params.md_metadata.default_tags["md-instance"] | split("-")[1]'
    PGHOST: .dependencies.postgres.hostname
    PGPORT: .dependencies.postgres.port
    PGDATABASE: .dependencies.postgres.database
    PGUSER: .dependencies.postgres.username
    PGPASSWORD: '.dependencies.postgres.secret_arn + ":password::"'
    REDIS_URL: '"rediss://" + .dependencies.cache.hostname + ":" + (.dependencies.cache.port | tostring)'
    BUCKET_NAME: .dependencies.bucket.name
    VISITS_URL: .dependencies.visits.url
