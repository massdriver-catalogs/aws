<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 935 782" width="935" height="782" role="img" aria-label="The platform project deploys vpc and dns-zone, which connect to ecs-cluster, and the apps project connects ecr-repository to codebase. Both are environment defaults of every app project: visits, care and billing. In visits, http-api, dynamodb-table and sqs-queue connect to the tendwell-visits API and its reminder sender. In care, postgres, valkey and s3-bucket connect to tendwell-care. In billing, mariadb and s3-bucket connect to tendwell-billing. tendwell-visits connects to tendwell-care through the tendwell-visits-api resource, and tendwell-care to tendwell-billing through tendwell-care-api.">
<title>The platform project deploys vpc and dns-zone, which connect to ecs-cluster, and the apps project connects ecr-repository to codebase. Both are environment defaults of every app project: visits, care and billing. In visits, http-api, dynamodb-table and sqs-queue connect to the tendwell-visits API and its reminder sender. In care, postgres, valkey and s3-bucket connect to tendwell-care. In billing, mariadb and s3-bucket connect to tendwell-billing. tendwell-visits connects to tendwell-care through the tendwell-visits-api resource, and tendwell-care to tendwell-billing through tendwell-care-api.</title>
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .bg { fill: #0d1117; }
