  .muted { fill: #8b8b94; font-size: 10.5px; }
  .label { fill: #a1a1aa; font-size: 10.5px; }
  .labelAccent { fill: #2dd4bf; font-size: 10.5px; font-weight: 600; }
  .chip { fill: #0a0a0b; stroke: #27272a; stroke-width: 1; }
  .halo { paint-order: stroke; stroke: #0d1117; stroke-width: 4px; stroke-linejoin: round; }
  .edge { fill: none; stroke: #71717a; stroke-width: 1.4; }
  .edgeAccent { fill: none; stroke: #2dd4bf; stroke-width: 1.6; }
  .edgeThick { fill: none; stroke: #2dd4bf; stroke-width: 2.6; }
  .dashed { stroke-dasharray: 5 4; }
  .head { fill: #71717a; }
  .headAccent { fill: #2dd4bf; }
  .lifeline { stroke: #3f3f46; stroke-width: 1.25; stroke-dasharray: 3 4; }
  .activation { fill: #0f2422; stroke: #2dd4bf; stroke-width: 1; }
  .frame { fill: none; stroke: #3f3f46; stroke-width: 1.25; }
  .frameTab { fill: #0a0a0b; stroke: #3f3f46; stroke-width: 1.25; }
  .divider { stroke: #3f3f46; stroke-width: 1.25; stroke-dasharray: 5 4; }
  .note { fill: #0f2422; stroke: #2dd4bf; stroke-width: 1; }
  .badge { fill: #2dd4bf; }
  .badgeText { fill: #0d1117; font-size: 9.5px; font-weight: 700; }
</style>
