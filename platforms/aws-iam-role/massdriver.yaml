name: aws-iam-role
version: 0.0.0
label: AWS IAM Role

ui:
  connectionOrientation: environmentDefault
  environmentDefaultGroup: credentials
  instructions:
    - label: AWS CLI
      path: ./instructions/AWS CLI.md
    - label: AWS Console
      path: ./instructions/AWS Console.md
  schema:
    ui:order: [arn, token_level, "*"]

schema:
  title: AWS IAM Role
  description: >-
    A role in your AWS account that Massdriver assumes with its identity token to build and run what
    you deploy. No keys are stored.
  type: object
  additionalProperties: false
  required:
    - arn
    - token_level
  properties:
    arn:
      title: Role ARN
      description: The ARN of the role, shown at the top of the role's page in the IAM console.
      type: string
      pattern: ^arn:aws(-[a-z]+)*:iam::[0-9]{12}:role/[a-zA-Z0-9+=,.@_/-]+$
      message:
        pattern: "Must be an IAM role ARN, for example arn:aws:iam::123456789012:role/massdriver."
      examples:
        - arn:aws:iam::123456789012:role/massdriver
    token_level:
      title: Token level
      description: >-
        Which Massdriver identity the role's trust policy accepts. Organization lets every deployment
        in your organization use the role; the narrower levels limit it to one project, environment
        or instance.
      type: string
      default: organization
      oneOf:
        - const: organization
          title: Organization
        - const: project
          title: Project
        - const: environment
          title: Environment
        - const: instance
          title: Instance
