<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 412" width="792" height="412" role="img" aria-label="Each environment deploys vpc, dns-zone and ecs-cluster once. They, and an app's codebase, are environment defaults of the app's project. In the project, http-api and sqs-queue connect to an app on lambda-function, and postgres and s3-bucket connect to an app on ecs-service.">
<title>Each environment deploys vpc, dns-zone and ecs-cluster once. They, and an app's codebase, are environment defaults of the app's project. In the project, http-api and sqs-queue connect to an app on lambda-function, and postgres and s3-bucket connect to an app on ecs-service.</title>
