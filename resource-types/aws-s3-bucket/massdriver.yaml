name: aws-s3-bucket
version: 0.0.0
label: AWS S3 Bucket

ui:
  connectionOrientation: link

schema:
  title: AWS S3 Bucket
  description: >-
    A private S3 bucket and the IAM policies that grant access to it. Consumers attach one policy
    to their own role rather than writing their own.
  type: object
  additionalProperties: false
  required:
    - name
    - arn
    - region
    - policies
  properties:
    name:
      title: Bucket Name
      type: string
      minLength: 1
    arn:
      title: Bucket ARN
      type: string
      minLength: 1
    region:
      title: Region
      type: string
      minLength: 1
    policies:
      title: Access Policies
      description: IAM managed policies a consumer attaches to its role.
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - name
          - arn
        properties:
          name:
            title: Name
            description: What the policy allows, e.g. read or read-write.
            type: string
          arn:
            title: Policy ARN
            type: string
